<title data-page-node-id="dQnx9g4nyrMPK0MYVDUB5K" data-pnid-children="x3GOh7v520tbXCvAR0mzLS">私域社群运营台</title>
<style data-page-node-id="0L9JORhFPUh3NjA8BeeSbr" data-pnid-children="RFUBpiyy4LG5IYx5oIudmx">
:root{
  --brand:#12b886; --brand-d:#0ca678; --brand-l:#e6fcf5;
  --bg:#f4f6f8; --card:#ffffff; --text:#1f2933; --sub:#7b8794; --line:#e4e9ee;
  --shadow:0 2px 12px rgba(20,40,60,.06);
  --radius:14px;
  --warn:#ff922b; --danger:#fa5252; --info:#4dabf7; --gold:#f59f00; --purple:#7048e8;
}
[data-theme="dark"]{
  --bg:#141b1f; --card:#1d262b; --text:#e6edf1; --sub:#8b98a3; --line:#2b363d;
  --brand:#20c997; --brand-d:#12b886; --brand-l:#12362c;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;font-size:15px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--brand);text-decoration:none}

/* 布局 */
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:700;font-size:18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-d));display:flex;align-items:center;justify-content:center;font-size:19px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;color:var(--sub);font-weight:500;margin-bottom:3px;transition:.15s;font-size:14.5px}
.nav-item .ic{font-size:17px;width:22px;text-align:center}
.nav-item:hover{background:var(--brand-l);color:var(--brand-d)}
.nav-item.active{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 4px 12px rgba(18,184,134,.3)}
.main{flex:1;margin-left:230px;padding:26px 30px 60px;max-width:1200px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.topbar h1{font-size:22px;font-weight:700}
.topbar .sub{color:var(--sub);font-size:13px;margin-top:2px}
.tools{display:flex;gap:9px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow)}
.icon-btn:hover{border-color:var(--brand)}

/* 卡片通用 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;border:1px solid var(--line)}
.card h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .tag{font-size:11px;font-weight:500;color:var(--sub);background:var(--bg);padding:2px 8px;border-radius:6px;margin-left:auto}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

/* 数据块 */
.stat{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .lbl{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:6px}
.stat .val{font-size:28px;font-weight:700;margin-top:6px}
.stat .val small{font-size:14px;font-weight:500;color:var(--sub)}
.stat .delta{font-size:12px;margin-top:4px}
.up{color:var(--brand-d)} .down{color:var(--danger)}

/* 按钮 */
.btn{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{opacity:.92;transform:translateY(-1px)}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:7px}

/* 阵地/成员卡片 */
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative;transition:.15s}
.tile:hover{border-color:var(--brand);transform:translateY(-2px)}
.tile .plat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;color:#fff}
.tile .name{font-size:16px;font-weight:700;margin:10px 0 4px}
.tile .meta{color:var(--sub);font-size:13px}
.tile .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.tile .del{position:absolute;top:12px;right:12px;color:var(--sub);font-size:16px;opacity:.5}
.tile .del:hover{opacity:1;color:var(--danger)}

.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-block}

/* 表格 */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--sub);font-weight:600;font-size:12.5px}
tr:hover td{background:var(--brand-l)}

/* 进度条 */
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-d));border-radius:6px}

/* 漏斗 */
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .step{display:flex;align-items:center;gap:12px}
.funnel .fbar{flex:1;height:40px;border-radius:9px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:600;font-size:14px;transition:.4s}
.funnel .fnum{width:74px;text-align:right;font-weight:700;font-size:15px}

/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .cell{background:var(--bg);border:1px solid var(--line);border-radius:9px;min-height:80px;padding:6px;font-size:12px;position:relative}
.cal .cell .d{color:var(--sub);font-weight:600;font-size:11px}
.cal .cell.today{border-color:var(--brand);background:var(--brand-l)}
.cal .ev{background:var(--brand);color:#fff;border-radius:5px;padding:2px 5px;margin-top:3px;font-size:11px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .head{text-align:center;color:var(--sub);font-size:12px;font-weight:600;padding:4px 0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;transition:.15s}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* 空状态 */
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.empty .ico{font-size:44px;opacity:.4;margin-bottom:10px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(10,20,25,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.mask.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:18px;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
.field textarea{min-height:80px;resize:vertical}
.field .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btns .btn{flex:1;justify-content:center}

/* 素材/话术条目 */
.snip{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:10px;position:relative}
.snip .cat{font-size:11px;color:var(--brand-d);font-weight:600;background:var(--brand-l);padding:2px 8px;border-radius:6px}
.snip .txt{margin-top:8px;white-space:pre-wrap;font-size:14px;line-height:1.6}
.snip .ops{display:flex;gap:8px;margin-top:10px}

/* 移动端底部Tab */
.tabbar{display:none}
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0;padding:16px 14px 90px;max-width:100%}
  .topbar h1{font-size:19px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g4.keep2{grid-template-columns:1fr 1fr}
  .cal{font-size:10px}
  .cal .cell{min-height:56px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:60;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  .tabbar .t{flex:1;text-align:center;color:var(--sub);font-size:10px;padding:5px 0;border-radius:8px}
  .tabbar .t .ic{font-size:19px;display:block;margin-bottom:2px}
  .tabbar .t.active{color:var(--brand)}
  .field .two{grid-template-columns:1fr}
}
.hide{display:none!important}
.flex{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mt{margin-top:14px}
.wrap-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.wrap-h h2{font-size:17px}
.hint{background:var(--brand-l);border:1px solid var(--brand);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--brand-d);margin-bottom:18px}

/* ===== 引流落地页 ===== */
.lp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 15px;border-radius:8px;font-size:13.5px;color:var(--sub);font-weight:500;transition:.15s}
.seg button.on{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(18,184,134,.28)}
.lp-stage{background:var(--bg);border:1px dashed var(--line);border-radius:16px;padding:16px}
.lp-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 24px rgba(20,40,60,.08)}
.lp-hero{padding:36px 28px 30px;background:linear-gradient(135deg,#12b886,#0ca678);color:#fff;position:relative}
.lp-hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);right:-60px;top:-70px}
.lp-hero h1{font-size:24px;line-height:1.35;margin-bottom:10px;position:relative;z-index:1}
.lp-hero p{font-size:14px;opacity:.94;line-height:1.7;white-space:pre-wrap;position:relative;z-index:1}
.lp-sec{padding:24px 28px;border-bottom:1px solid var(--line)}
.lp-sec:last-child{border-bottom:none}
.lp-sec h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.lp-sec p{font-size:14px;line-height:1.85;color:var(--text);white-space:pre-wrap;word-break:break-word}
.lp-img{width:100%;max-width:520px;border-radius:12px;display:block;margin:10px 0;border:1px solid var(--line)}
.lp-qr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lp-qr .q{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.lp-qr .q .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px}
.lp-qr .q.free .tag{background:#e6fcf5;color:#0ca678}
.lp-qr .q.paid .tag{background:#fff4e6;color:#e8590c}
.lp-qr .q .qrbox{width:150px;height:150px;margin:0 auto 10px;border-radius:10px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.lp-qr .q .qrbox img{width:100%;height:100%;object-fit:contain}
.lp-qr .q .qrbox .ph{color:var(--sub);font-size:11.5px;line-height:1.6;padding:0 10px}
.lp-qr .q .nm{font-size:13.5px;font-weight:600}
.lp-qr .q .ds{font-size:11.5px;color:var(--sub);margin-top:4px}
.lp-feat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp-feat div{background:var(--brand-l);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--brand-d);line-height:1.5}
.lp-edit{border:1px dashed var(--brand);border-radius:16px;padding:18px;background:var(--card)}
.lp-edit .fld{margin-bottom:14px}
.lp-edit label{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:6px}
.lp-edit input[type=text],.lp-edit textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--bg);color:var(--text);outline:none;transition:.15s}
.lp-edit input[type=text]:focus,.lp-edit textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,184,134,.12)}
.lp-edit textarea{min-height:96px;resize:vertical;line-height:1.7}
.lp-edit .hr{height:1px;background:var(--line);margin:18px 0}
.lp-edit .sub-t{font-size:13.5px;font-weight:700;margin-bottom:12px;color:var(--brand-d)}
.up-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.up-row .prev{width:62px;height:62px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.up-row .prev img{width:100%;height:100%;object-fit:cover}
.up-row .prev span{font-size:10.5px;color:var(--sub);text-align:center;line-height:1.3}
.up-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;color:var(--text)}
.up-btn:active{background:var(--brand-l)}
.lp-link-box{display:flex;gap:8px;margin-top:10px}
.lp-link-box input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;background:var(--bg);color:var(--sub)}
.save-fl{position:sticky;bottom:0;background:var(--card);padding:12px 0 0;border-top:1px solid var(--line);margin-top:6px}
@media(max-width:768px){
  .lp-qr{grid-template-columns:1fr}
  .lp-feat{grid-template-columns:1fr}
  .lp-hero{padding:26px 18px 24px}
  .lp-hero h1{font-size:20px}
  .lp-sec{padding:20px 18px}
  .lp-stage{padding:10px;border-radius:12px}
  .lp-edit{padding:14px}
  .up-btn{min-height:44px}
}

function growthSVG(snaps){
  const W=680,H=200,pad=34;
  const vals=snaps.map(s=>s.total);
  const max=Math.max(...vals),min=Math.min(...vals,0);
  const range=max-min||1;
  const step=(W-pad*2)/(snaps.length-1);
  const pts=snaps.map((s,i)=>[pad+i*step, H-pad-(s.total-min)/range*(H-pad*2)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${H-pad} L${pad} ${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".28"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/>
    <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--brand-d)"/>
      <text x="${p[0].toFixed(1)}" y="${(p[1]-10).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--text)" font-weight="600">${snaps[i].total}</text>
      <text x="${p[0].toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="12" fill="var(--sub)">${monLabel(snaps[i].m)}</text>`).join('')}
  </svg>`;
}

  const s=DB.get('snippets',[]).find(x=>x.id===id);if(!s)return;
  const doCopy=(txt)=>{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(t('copied'))).catch(()=>fallback(txt))}
    else fallback(txt);
  };
  const fallback=(txt)=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'))}catch(e){alert(t('copyFail'))}document.body.removeChild(ta)};

}

      const file=e.target.files&&e.target.files[0];
      if(!file) return;
      if(file.size>5*1024*1024){alert('图片不能超过 5MB');return;}
      compressImage(file,function(dataUrl){
        const k=e.target.getAttribute('data-lpfield');
        const cur=lpReadRaw();
        cur[k]=dataUrl;
        lpSet(cur);
        const pv=document.getElementById('prev_'+k);
        if(pv) pv.innerHTML=imgTag(dataUrl,'','预览');
        const btn=pv&&pv.parentNode?pv.parentNode.querySelector('button[onclick]'):null;
        if(pv&&!pv.parentNode.querySelector('.rm')) {
          const b=document.createElement('button');
          b.className='up-btn rm'; b.type='button'; b.style.marginTop='8px';
          b.textContent='移除'; b.onclick=function(){clearImage(k)};
          pv.parentNode.querySelector('div').appendChild(b);
        }
        setLpSync('图片已更新');
      });
    });
  });
}
function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=function(){
    const raw=String(reader.result);
    try{
      const img=new Image();
      img.onload=function(){
        const maxW=800;
        const scale=Math.min(1,maxW/img.width);
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*scale);
        cv.height=Math.round(img.height*scale);
        const cx=cv.getContext('2d');
        cx.fillStyle='#ffffff';
        cx.fillRect(0,0,cv.width,cv.height);
        cx.drawImage(img,0,0,cv.width,cv.height);
        cb(cv.toDataURL('image/jpeg',0.86));
      };
      img.onerror=function(){cb(raw)};
      img.src=raw;
    }catch(e){cb(raw)}
  };
  reader.readAsDataURL(file);
}
function pickImage(id){
  const el=document.getElementById('file_'+id);
  if(el) el.click();
}
function clearImage(id){
  const cur=lpReadRaw();
  cur[id]='';
  lpSet(cur);
  render();
  setLpSync('图片已移除');
}
function setLpMode(m){
  if(m===lpMode) return;
  const d=lpGet();
  if(lpMode==='edit'&&m==='view') collectLanding();
  lpMode=m;
  render();
}
function collectLanding(){
  const d=lpGet();
  ['lp_heroTitle','lp_heroSub','lp_intro','lp_features','lp_rules','lp_freeName','lp_freeDesc','lp_freeNote','lp_paidName','lp_paidDesc','lp_paidNote','lp_ctaTitle','lp_ctaText'].forEach(function(id){
    const el=document.getElementById(id);
    if(el) d[id]=el.value;
  });
  return d;
}
function saveLanding(){
  const d=collectLanding();
  lpSet(d);
  setLpSync('已保存到本机');
  lpMode='view'; render();
}
function setLpSync(msg){
  const el=document.getElementById('lpSync');
  if(el) el.textContent=msg;
}
function copyLandingLink(){
  const url=location.href.split('#')[0];
  const done=function(){setLpSync('链接已复制，去微信里发给群友吧');};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){fallbackCopy(url,done)});
      return;
    }
  }catch(e){}
  fallbackCopy(url,done);
}
function fallbackCopy(text,cb){
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); cb();
  }catch(e){alert('复制失败，请手动复制地址栏链接')}
}
if(typeof window!=='undefined'){window.pickImage=pickImage;window.clearImage=clearImage;window.saveLanding=saveLanding;window.setLpMode=setLpMode;window.copyLandingLink=copyLandingLink;}
</script>
</body>
